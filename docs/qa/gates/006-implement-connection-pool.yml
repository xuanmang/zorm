top_issues:
  - id: "LOGIC-001"
    severity: medium
    finding: "closeConnectionAtIndex 方法中的 available_indices 更新逻辑存在潜在bug"
    location: "src/driver/pool.zig:297-321"
    fixed: true
    fixed_date: "2025-10-17T08:00:00Z"
    details: |
      当 swapRemove 删除一个索引后,代码使用 break 跳出循环,可能导致后续需要更新的索引未被处理。

      场景示例:
      - pool_metadata = [A, B, C, D, E] (索引 0-4)
      - available_indices = [1, 4]
      - closeConnectionAtIndex(1) 执行后:
        - pool_metadata.swapRemove(1) → [A, E, C, D] (E移到索引1)
        - available_indices 期望: [1] (索引4→索引1)
        - available_indices 实际: [4] (bug,未更新)

      **修复方案:**
      改用 while 循环完整遍历所有索引,在 swapRemove 删除连接前记录 old_last_idx,
      然后更新所有指向 old_last_idx 的索引为 index,确保索引一致性。
    suggested_action: "重构索引更新逻辑,确保完整遍历并更新所有受影响的索引"
    suggested_owner: "dev"

